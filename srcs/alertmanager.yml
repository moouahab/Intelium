global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - receiver: email
      match_re:
        severity: critical
      continue: true
    - receiver: silence
      match_re:
        severity: info

receivers:
  - name: silence
    webhook_configs: []

  - name: slack
    slack_configs:
      - api_url: "https://example.invalid/webhook"
        send_resolved: true
        title: "[CTI] {{ .GroupLabels.alertname }} ({{ .Status }})"
        text: >-
          Alerts: {{ range .Alerts }}• {{ .Annotations.summary }} ({{ .Labels.severity | default "info" }})
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}{{ end }}

  - name: email
    email_configs:
      - to: "mohamed.ouahab1999@gmail.com"
        from: "cti@example.com"
        smarthost: "smtp.example.com:587"
        auth_username: ""
        auth_password: ""
