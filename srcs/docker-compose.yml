services:
  ollama:
    image: ollama/ollama:0.40.18
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:0.40.18
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy

  cti-verify:
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: ./requirements/app
      dockerfile: Dockerfile
    working_dir: /app
    command: ["python", "scripts/verify_cti_report.py"]
    environment:
      PYTHONPATH: /app
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      OLLAMA_NUM_CTX: "4096"
      OLLAMA_NUM_PREDICT: "1024"
      OLLAMA_TEMPERATURE: "0"
    volumes:
      - ./requirements/app:/app
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  cti-scraper:
    build:
      context: ./requirements/app
      dockerfile: Dockerfile
    container_name: cti-scraper
    restart: unless-stopped
    working_dir: /app
    command: ["python", "scripts/orchestrator.py", "--config", "config/conf.yaml", "--metrics", "data/health.json"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ./requirements/app:/app
      - ./requirements/app/data:/app/data
      - ./requirements/app/logs:/app/logs
      - ./requirements/app/reports:/app/reports
      - ./requirements/app/docs:/app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONPATH: /app
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  metrics:
    build:
      context: ./requirements/app
      dockerfile: Dockerfile
    container_name: cti-metrics
    restart: unless-stopped
    working_dir: /app
    command: ["python", "scripts/metrics_server.py", "--file", "data/health.json", "--port", "9000"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ./requirements/app/data:/app/data
    ports:
      - "9000:9000"
    environment:
      PYTHONPATH: /app
    depends_on:
      - cti-scraper

  mongo:
    image: mongo:6
    container_name: cti-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./requirements/mangodb/data:/data/db
    environment: {}

  vault:
    image: hashicorp/vault:1.15
    container_name: cti-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment: {}
    cap_add:
      - IPC_LOCK
    volumes:
      - ./requirements/app/vault:/vault/file

  codex:
    build:
      context: ./requirements/app
      dockerfile: Dockerfile
    container_name: cti-codex
    working_dir: /app
    command: ["sleep", "infinity"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ./requirements/app:/app
      - ./requirements/app/data:/app/data
      - ./requirements/app/logs:/app/logs
      - ./requirements/app/reports:/app/reports
      - ./requirements/app/docs:/app/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONPATH: /app
    depends_on:
      - cti-scraper

  prometheus:
    image: prom/prometheus:latest
    container_name: cti-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - metrics

  grafana:
    image: grafana/grafana:10.4.2
    container_name: cti-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: cti-alertmanager
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    ports:
      - "9093:9093"
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml

volumes:
  ollama_data:
  pgdata:
  prometheus_data:
  grafana_data:

configs:
  alertmanager_config:
    content: |
      global:
        resolve_timeout: 5m

      route:
        receiver: slack
        group_by: ["alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
        routes:
          - receiver: email
            match_re:
              severity: critical
            continue: true
          - receiver: silence
            match_re:
              severity: info

      receivers:
        - name: silence
          webhook_configs: []

        - name: slack
          slack_configs:
            - api_url: "${SLACK_WEBHOOK_URL:-https://example.invalid/webhook}"
              send_resolved: true
              title: "[CTI] {{ .GroupLabels.alertname }} ({{ .Status }})"
              text: >-
                Alerts: {{ range .Alerts }}• {{ .Annotations.summary }} ({{ .Labels.severity | default "info" }})
                {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}{{ end }}

        - name: email
          email_configs:
            - to: "${ALERT_EMAIL_TO:-devnull@example.com}"
              from: "${ALERT_EMAIL_FROM:-cti@example.com}"
              smarthost: "${SMTP_HOST:-localhost}:${SMTP_PORT:-25}"
              auth_username: "${SMTP_USER:-}"
              auth_password: "${SMTP_PASS:-}"
