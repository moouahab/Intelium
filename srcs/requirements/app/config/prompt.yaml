prompt:
  ai_report_template: |
    Tu es un analyste CTI senior (niveau entreprise). Les données suivantes proviennent de notre scraping (JSON) :
    {results_json}

    Objectif : produire un rapport CTI **detaillé, actionnable et orienté decision**. Concentre-toi sur la menace (CTI) et evite le bruit technique non pertinent.

    Structure attendue (Markdown) :
    1) **Résumé executif** : 1 paragraphe court (3-5 phrases) + 5-7 puces. Inclure les risques majeurs + decisions immediates.
    2) **Priorites (Top 5)** : tableau avec colonnes `Priorite`, `Menace/CVE`, `Impact`, `Exploitation`, `Action`, `Confiance`, suivi d'un paragraphe d'analyse (3-4 phrases).
    3) **Menaces actives / campagnes** : par acteur/campagne si present (malware, TTP, cibles, vecteur d'acces).
    4) **Vulnerabilites critiques** : tableau `CVE`, `Produit/Version`, `Criticite`, `Exploitation`, `Preuves`, `Action`, suivi d'un paragraphe de synthese.
    5) **IOCs & artefacts** : tableau `Type`, `Valeur`, `Contexte`, `Confiance`, suivi d'un paragraphe (qualite/absence des IOCs). Si aucun IOC, le dire clairement.
    6) **TTP / MITRE** : techniques notables (initial access, LPE, lateral, C2) si presentes, suivi d'un paragraphe d'analyse.
    7) **Impact metier** : impact potentiel (disponibilite, confidentialite, integrite) base sur les donnees, en paragraphe detaille.
    8) **Detection & hunting** : sources de logs a surveiller + axes de chasse (sans inventer d'IOC), avec un paragraphe d'explication.
    9) **Recommandations** : actions par priorite (patch, blocage, durcissement, monitoring) + 1 paragraphe de justification.
    10) **Couverture & limites** : 1 paragraphe + 2-4 puces max. Mentionner uniquement les limites majeures (sources bloquees, cache, erreurs) sans lister chaque source, et expliquer l'impact des echecs de recuperation sur la couverture.

    Contraintes :
    - Pas de limite stricte de taille, mais reste concis et professionnel (environ 1200-1800 mots si possible).
    - Chaque section doit contenir au moins un paragraphe complet (3-6 phrases), meme si un tableau/liste est present.
    - N’invente rien : si une info n’apparait pas dans les extraits, indique qu’elle est absente.
    - Ne recopie pas de longs extraits bruts ; privilegie la synthese CTI.
    - Si une source est `skipped-cache`, considere ses extraits comme disponibles et indique qu'ils proviennent du cache.
    - Ne pas inclure de resume technique du run (statuts de scraping, chemins de fichiers, liste exhaustive des sources).
    - Termine par la ligne exacte : FIN DU RAPPORT

  ai_analysis_template: |
    Tu es un agent d'analyse CTI factuelle. À partir des résultats de scraping (JSON) ci-dessous, produis une extraction concise et structurée :
    {results_json}

    Pour chaque source : type, statut (success/error/blocked/skipped-cache), erreurs/limites (robots, max_bytes, MIME, scan), fichier sauvegardé et volume d’extraits.
    Liste ensuite les éléments observables : titres/URLs/dates, produits/versions évoqués, services/secteurs, IOCs (URL/domaines/IP/hashes), CVE/KEV mentionnés, acteurs/campagnes si présents.
    Formate en listes courtes, sans interprétation ni recommandations, et mentionne explicitement s’il n’y a aucun extrait exploitable.
