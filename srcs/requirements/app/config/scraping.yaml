data_scraper:
  html:
    extract:
      - tag: "h1"
      - tag: "h2"
      - tag: "p"
      - tag: "a"
      - tag: "li"
      - tag: "img"
      - tag: "script"
    include_attributes: ["href", "src", "alt"]
    errors: "log"
    extract_iocs: true   # extrait CVE/URL/IP des contenus HTML et liens
    sanitize: false      # sanitation légère (scripts/commentaires retirés)
    min_chars: 3         # filtre les extraits trop courts
    # certkev: true      # active l'extraction contextuelle pour les bulletins CERT/KEV (auto si nom contient cert/kev/cisa)

  api:
    parse_as: "json"
    accept_mime:
      - application/json
      - text/plain    # fallback pour certains JSON servis en text/plain
    fields:
      - name: "vulnerability"
        path: "$.vulnerabilities[*].cveID"
      - name: "description"
        path: "$.vulnerabilities[*].notes[*].text"
      - name: "vendor"
        path: "$.vulnerabilities[*].vendorProject"
    errors: "ignore"
    extract_iocs: true   # utile pour KEV/CVE/OTX

  xml:
    extract_tags:
      - tag: "item"
      - tag: "title"
    errors: "log"
    extract_iocs: true
    sanitize: false      # sanitation légère (commentaires)
    min_chars: 3

  pdf:
    extract_text: true
    keep_images: true        # ajoute une ligne par image intégrée
    max_pages: 8             # borne le parsing sur les PDF volumineux
    max_chars: 4000          # tronque chaque page pour éviter les extraits trop longs
    max_total_chars: 12000   # limite globale sur tout le PDF
    errors: "log"
    min_chars: 5

  csv:
    delimiter: ","
    has_header: true
    select_columns: []
    errors: "ignore"

  stix:
    max_description_chars: 1000

  image:
    ocr: true
    languages: ["eng", "fra"]  # langages Tesseract installés
    max_chars: 2000
    errors: "warn"
    min_chars: 5

  txt:
    extract_text: true
    errors: "ignore"
    extract_iocs: true
    min_chars: 3

  ignore:
    reason: "This file is not relevant to threat intelligence collection."

  per_source:
    CISA-KEV-CSV:
      csv:
        certkev: false  # conserver les lignes structurées sans extraits heuristiques ajoutés
        record_format: json
        sort_by: dateAdded
        descending: true
        max_rows: 200
        select_columns: [cveID, vendorProject, product, vulnerabilityName, dateAdded, shortDescription, requiredAction, dueDate, knownRansomwareCampaignUse, notes]
    FEODO-C2-CSV:
      csv:
        record_format: json
        comment_prefix: "#"
        sort_by: last_online
        descending: true
        max_rows: 100
        select_columns: [first_seen_utc, dst_ip, dst_port, c2_status, last_online, malware]
    CERT-FR:
      html:
        certkev: true
    CERT-FR-RSS:
      xml:
        certkev: true
    CISA-KEV:
      api:
        certkev: true
