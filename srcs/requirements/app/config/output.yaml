output:
  ai_report:
    enabled: true
    mode: cli
    langgraph_llm_command: ""
    command: "python3 scripts/mistral_llm.py"
    output: reports/rapport.md          # rapport IA fusionné dans le même fichier principal
    timeout: 320                       # plus de temps pour finir le rapport
    retries: 4
    retry_delay: 5
    prompt_template: ""                # utilise le template de prompt.yaml (ajusté)
    prompt_path: config/prompt.yaml
    required_sections:
      - "Résumé exécutif"
      - "IOCs"
      - "Vulnérabilités"
    pass_prompt_as_arg: false
    prompt_via_file: true
    # Limites pour éviter les prompts trop volumineux (ajustables si besoin)
    max_results: 18
    max_extracted_per_source: 18
    max_extracted_chars: 800
    fallback:
      command: "python3 scripts/mistral_llm.py --model mistral-small-latest --max-tokens 4096"
      timeout: 260
      pass_prompt_as_arg: false
      prompt_via_file: true
    scoring:
      weights:
        malware: 30
        vulnerability: 40
        attack_technique: 20
        default: 5
      cvss:
        enabled: true
        high_threshold: 9.0
        medium_threshold: 7.0
    analysis:
      enabled: false  # désactivée pour éviter un second appel LLM ; active-la si nécessaire
  format: markdown
  additional_formats:
    - json
  file: reports/rapport.md
  detail_dir: reports/sources_user
  split_per_source: true
