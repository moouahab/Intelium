output:
  ai_report:
    enabled: true
    provider: ollama
    model: qwen2.5:1.5b
    host: http://127.0.0.1:11434
    output: reports/rapport_ia.md  # ne remplace jamais le rapport technique
    timeout: 180
    max_evidence: 6
    evidence_per_source: 2
    max_evidence_chars: 600
    accept_incomplete: false
    fill_missing_sections: false
    restore_on_incomplete: true
    scoring:
      weights:
        malware: 30
        vulnerability: 40
        attack_technique: 20
        default: 5
      cvss:
        enabled: true
        high_threshold: 9.0
        medium_threshold: 7.0
    analysis:
      enabled: false  # désactivée pour éviter un second appel LLM ; active-la si nécessaire
  email_report:
    enabled: true
    to: []                   # vide => fallback sur scheduling.notification_email ou ALERT_EMAIL_TO
    from: ""                 # vide => ALERT_EMAIL_FROM
    subject: "[CTI] Rapport quotidien {date}"
    body: "Bonjour,\n\nVeuillez trouver le rapport CTI en piece jointe.\n"
    attach_pdf: true
    pdf_source: report       # summary => utilise reports/summary.md, report => utilise rapport.md
    pdf_source_path: ""      # optionnel: chemin explicite du markdown a convertir
    pdf_path: reports/rapport.pdf
    pdf_style: enterprise    # basic ou enterprise (mise en page avec sommaire + tables)
    pdf_regenerate: true     # regenere le PDF a chaque run pour eviter les fichiers obsoletes
    smtp_ssl: false          # true si SMTP SSL direct (ex: port 465)
    smtp_starttls: true
    smtp_timeout: 30
  format: markdown
  additional_formats:
    - json
  file: reports/rapport.md
  detail_dir: reports/sources_user
  split_per_source: true
