name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcs/requirements/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            srcs/requirements/app/requirements.txt
            srcs/requirements/app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Ensure .env is not committed
        run: |
          if git ls-files -z | tr '\0' '\n' | grep -qx '.env'; then
            echo "ERROR: .env is committed. Remove it from the repo."
            exit 1
          fi
